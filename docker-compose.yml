services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: dsa-plab-db
    env_file:
      - .env
    environment:
      ACCEPT_EULA: ${ACCEPT_EULA:-Y}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - dsa_mssql_data:/var/opt/mssql
    networks:
      - dsa_plab_net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build: .
    container_name: dsa-plab-backend
    env_file:
      - .env
    environment:
      SECRET_KEY: ${SECRET_KEY}
      # SQLAlchemy/ODBC (db.py) — dsa_app → DSA_Student_Success
      MSSQL_HOST: ${MSSQL_HOST:-db}
      MSSQL_PORT: ${MSSQL_PORT:-1433}
      MSSQL_DATABASE: ${MSSQL_DATABASE:-DSA_Student_Success}
      MSSQL_USER: ${MSSQL_USER:-}
      MSSQL_PASSWORD: ${MSSQL_PASSWORD:-}
      USE_SEED_DATA: ${USE_SEED_DATA:-1}
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - dsa_plab_net

networks:
  dsa_plab_net:
    name: dsa_plab_net

volumes:
  dsa_mssql_data:
    name: dsa_mssql_data
