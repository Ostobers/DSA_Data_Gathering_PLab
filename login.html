<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in</title><script src="auth.js"></script><link rel="stylesheet" href="style.css"></head>
<body>
<nav id="nav"></nav>
<h1>Sign in (simulated)</h1>
<p>Prototype only: pick a role to test page access. There is no password and no real account.</p>
<form id="lf"><fieldset><legend>Sign in as</legend>
<label><input type="radio" name="role" value="student" checked> Student</label>
<label><input type="radio" name="role" value="faculty"> Faculty</label>
<label><input type="radio" name="role" value="administrator"> Administrator</label>
</fieldset><button type="submit">Sign in</button></form>
<script>
document.getElementById('lf').onsubmit=function(e){
 e.preventDefault();
 var r=document.querySelector('input[name=role]:checked').value;
 try{sessionStorage.setItem('role',r);}catch(x){alert('Your browser blocked sessionStorage.');return;}
 location.href=Auth.HOME[r];
};
</script>
</body></html>
